name: Link Check

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------
      # Checkout the repository
      # -----------------------------------------------------------------
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # Build Linkinator container
      # -----------------------------------------------------------------
      - name: Build Linkinator container
        run: |
          make -C linkchecker docker-build

      # -----------------------------------------------------------------
      # Run the CI‑mode target (fails on broken links)
      # -----------------------------------------------------------------
      - name: Run full link check (CI mode)
        run: |
          make -C linkchecker linkcheck-ci

      # -----------------------------------------------------------------
      # Run the Navigation-only check (informational)
      # -----------------------------------------------------------------
      - name: Run Navigation-only check
        run: |
          make linkchecker
