# -------------------------------------------------
# Build system
# -------------------------------------------------
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

# -------------------------------------------------
# Project metadata
# -------------------------------------------------
[project]
name = "cloudmesh-ai-lecture"
version = "0.1.0"
description = "Lecture material for Cloudmesh AI"
authors = [{name = "Your Name", email = "you@example.com"}]
requires-python = ">=3.8"

# NOTE: every entry in the array must be separated by a comma
dependencies = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-caption",
    "mkdocs-exclude-search",
    "mkdocs-glightbox",
    "mkdocs-video",
    "mkdocs-slides",
    "mkdocs-macros-plugin",
    "pymdown-extensions",
]

# -------------------------------------------------
# Setuptools specific configuration
# -------------------------------------------------
[tool.setuptools]
# Explicitly list the two top‑level packages in this flat layout.
packages = ["hooks", "themes"]
# If you ever switch to a `src/` layout, uncomment the lines below:
# package-dir = {"" = "src"}
# packages.find = {where = ["src"]}

# -------------------------------------------------
# Cloudmesh‑AI specific metadata (optional)
# -------------------------------------------------
[tool.cloudmesh-ai]
category = "knowledge"
order = 10
status = "stable"