[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmesh-ai-lecture"
version = "0.1.0"
description = "Lecture material for Cloudmesh AI"
authors = [{name = "Your Name", email = "you@example.com"}]
requires-python = ">=3.8"
dependencies = [
    "mkdocs"
    "mkdocs-material",
    "mkdocs-caption",
    "mkdocs-exclude-search",
    "mkdocs-glightbox",
    "mkdocs-video",
    "mkdocs-slides",
    "mkdocs-macros-plugin",
    "pymdown-extensions",
]

[tool.setuptools]
packages = ["hooks", "themes"]   # explicit list
# If you later move to src/, replace the line above with:
# package-dir = {"" = "src"}
# packages.find = {where = ["src"]}

[tool.cloudmesh-ai]
category = "knowledge"
order = 10
status = "stable"

